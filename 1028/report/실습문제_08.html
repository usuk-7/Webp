<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transform:scale()</title>
    <script>
        let extend = 1;
        function scale(obj) {
            extend += 1;
            obj.style.transform = "scale(" + extend + ",1)";
        }
    </script>
</head>
<body>
    <h3>클릭하면 2,3,4배로 옆으로 늘어납니다.</h3>
    <hr>
    <img src="media/spongebob.png" width="100" height="100" onclick="scale(this)">
</body>
</html>
