<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이트 접속</title>
<script>
    function loadSite(select) {
        let index = select.selectedIndex;
        let site = select.options[index].value;
        window.open(site, "siteWin", "width=500, height=200");
    }
</script>
</head>
<body>
<h3>옵션 선택으로 사이트 접속</h3>
<p>옵션 선택 마다 새 윈도우에 접속합니다.</p>
<hr>
<p>접속할 사이트</p>
<select onchange="loadSite(this)">
    <option value="https://www.naver.com">네이버</option>
    <option value="https://www.google.com">구글</option>
    <option value="https://www.oracle.com">오라클</option>
</select>
</body>
</html>
