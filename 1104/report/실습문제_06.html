<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>onwheel</title>
<script>
    function zoom(e, img) {
        e.preventDefault();
        if (e.wheelDelta > 0)
            img.width = img.width * 0.95;
        else
            img.width = img.width * 1.05;
    }
</script>
</head>
<body>
<h3>마우스 휠을 이용한 이미지 확대/축소</h3>
<hr>
<p>이미지 위에 휠을 위로 굴리면 이미지가 축소되고 아래로 굴리면 이미지가 확대됩니다.</p>
<img src="media/tulips.png" width="130" alt="튤립" onwheel="zoom(event, this)">
</body>
</html>
