<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마우스 클릭 연습</title>
    <style>
        table { border-collapse : collapse; }
        td {
            width : 50px;
            height : 50px;
            padding : 0;
            border : 1px solid navy;
            text-align : center;
        }
        img {
            width : 45px;
            height : 45px;
            visibility : hidden;
        }
    </style>
    <script>
        let cur = -1;
        function move() {
            let imgs = document.images;
            let i;
            do {
                i = Math.floor(Math.random() * imgs.length);
            } while (i == cur);
            if (cur != -1)
                imgs[cur].style.visibility = "hidden";
            imgs[i].src = "media/donkey.png";
            imgs[i].style.visibility = "visible";
            cur = i;
        }
        function makeTable() {
            let html = "";
            for (let r = 0; r < 10; r++) {
                html += "<tr>";
                for (let c = 0; c < 10; c++)
                    html += "<td><img alt='donkey' onclick='move()'></td>";
                html += "</tr>";
            }
            document.getElementById("board").innerHTML = html;
            move();
        }
    </script>
</head>
<body onload="makeTable()">
    <h3>마우스 클릭 연습</h3>
    <hr>
    <table id="board"></table>
</body>
</html>
