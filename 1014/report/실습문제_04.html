<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방문 요일</title>
</head>
<body>
    <h3>일요일은 pink, 다른 요일은 gold 배경</h3><hr>
    <script>
        let date = new Date();
        const days = ["일","월","화","수","목","금","토"];
        if (days[date.getDay()] == "일") {
            document.body.style.backgroundColor="pink";
        } else {
            document.body.style.backgroundColor="gold";
        }
        document.write("오늘 : "+date.getDate()+"일,"+days[date.getDay()]+"요일");
    </script>
</body>
</html>
