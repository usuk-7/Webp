<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소프트웨어 기술 선호에 관한 설문</title>
<link href="survey4.css" type="text/css" rel="stylesheet">
</head>
<body>

<header>
<h2>설문지</h2>
<p>
소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.
</p>
</header>
<hr>

<section>
<form>
<span class="field-label">학년</span>
<label>
<input type="radio" name="grade" value="1" checked>
1학년
</label>
<label>
<input type="radio" name="grade" value="2">
2학년
</label>
<label>
<input type="radio" name="grade" value="3">
3학년
</label>
<label>
<input type="radio" name="grade" value="4">
4학년
</label>
<br>

<span class="field-label">성별</span>
<label>
<input type="radio" name="gender" value="male">
남
</label>
<label>
<input type="radio" name="gender" value="female" checked>
여
</label>
<br>

<span class="field-label">관심 분야</span>
<select id="interest" name="interest">
<option value="mobile" selected>모바일 소프트웨어</option>
<option value="web">웹 소프트웨어</option>
<option value="ai">인공지능</option>
<option value="game">게임</option>
</select>
<br>

<span class="field-label">진로(다중 선택)</span>
<label>
<input type="checkbox" name="path" value="dev" checked>
개발
</label>
<label>
<input type="checkbox" name="path" value="plan">
기획
</label>
<label>
<input type="checkbox" name="path" value="sales">
영업
</label>
<label>
<input type="checkbox" name="path" value="startup">
창업
</label>
<br>

<div class="comment-row">
<span class="field-label">남기고 싶은 말</span>
<textarea id="comment" name="comment" rows="8" cols="60" placeholder="글을 남겨주세요"></textarea>
</div>

</form>
</section>

<footer>
<p>Copyright 2022 by Kitae</p>
</footer>

</body>
</html>
